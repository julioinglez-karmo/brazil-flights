name: sweep
on:
  schedule:
    - cron: "30 13 * * *" # 23:30 Brisbane (UTC+10)
  workflow_dispatch:
concurrency:
  group: fetch
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: fetch
        run: node scripts/fetch.mjs --mode sweep
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: sweep $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep 3
          done
          exit 1
      - name: Price alert issue
        if: steps.fetch.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "✈️ Price alert: A\$${{ steps.fetch.outputs.alert_price }} for 2 pax (target hit)" \
            --body "The pinned BNE→Brazil round trip dropped to **A\$${{ steps.fetch.outputs.alert_price }}** for 2 passengers. Check the dashboard." \
            --repo "$GITHUB_REPOSITORY"
      # The digest reads the data the fetch step just wrote, so it always
      # describes this run. Recipients live in MAIL_TO, never in the repo.
      - name: Build email digest
        id: digest
        run: node scripts/email.mjs --out "$RUNNER_TEMP/digest.html"
      - name: Send email digest
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Southbound Tracker <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.digest.outputs.subject }}
          html_body: file://${{ runner.temp }}/digest.html
